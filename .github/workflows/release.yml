name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -m1 -E '^ \* Version:' kybernaut-multilingual.php | awk '{print $3}')"
          CONST="$(grep -m1 -E "^const VERSION" kybernaut-multilingual.php | sed -E "s/.*'(.*)'.*/\1/")"
          echo "tag=$TAG header=$VERSION const=$CONST"
          test "$TAG" = "$VERSION" && test "$TAG" = "$CONST"

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: bin/build-zip.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/kybernaut-multilingual.zip --title "$GITHUB_REF_NAME" --generate-notes
